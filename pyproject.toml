[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csl"
version = "0.1.0"
description = "A self-improving common-sense layer for agent harnesses: one-line falsifiable rules, gated validation, derived counters."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Chris Chen", email = "fuleinist@users.noreply.github.com" }]
keywords = ["agents", "harness", "hooks", "skills", "validation", "claude-code", "codex", "hermes", "openclaw"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/fuleinist/csl"

[project.scripts]
csl = "csl.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
csl = ["data/*.md"]